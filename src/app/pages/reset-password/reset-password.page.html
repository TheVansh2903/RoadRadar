<head>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
  />
</head>
<body>
  <div class="container">
    <div (click)="navService.back()" class="back"><i class="fa-solid fa-arrow-left"></i></div>

    <div class="logo"><img class="RR" src="assets/icon/logo.png" alt="" /></div>

    <h1>Reset Password</h1>
    <hr class="line" />

    
    <p class="input-title">Enter Your Password</p>
    <div class="input-group">
      <i class="fa-solid fa-key"></i>

      <input
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Password"
        [(ngModel)]="password"
      />

      <i
        class="fa-solid"
        [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
        (click)="togglePassword()"
        style="cursor: pointer"
      ></i>
    </div>
    <p class="input-title">Re-Enter Your Password</p>
    <div class="input-group">
      <i class="fa-solid fa-key"></i>

      <input
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Password"
        [(ngModel)]="password"
      />

      <i
        class="fa-solid"
        [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
        (click)="togglePassword()"
        style="cursor: pointer"
      ></i>
    </div>

    <button class="login-btn" >Reset Password</button>

  </div>
</body>
